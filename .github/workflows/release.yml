name: Release

# manifest.json의 version이 바뀌어 main에 푸시되면 v<version> 태그와 릴리스를 자동 생성
on:
  push:
    branches: [main]
    paths: [custom_components/vnrisa_bill/manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "tag=v$(jq -r .version custom_components/vnrisa_bill/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released"; exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
